plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.11'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = "https://maven.neoforged.net/releases"
        name = "NeoForged"
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }

    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.theillusivec4.top/" }

    maven {
        url = "https://maven.blamejared.com/"
        name = "BlameJared"
        content {
            includeGroup "foundry.veil"
        }
    }

    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        name = "Fuzs Mod Resources"
    }

    maven {
        url = "https://modmaven.dev"
        name = "ModMaven"
    }
}

neoForge {
    version = "${neo_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
            programArguments.addAll '--nogui'
            systemProperties.put 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArguments.addAll '--nogui'
            systemProperties.put 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

base {
    archivesName = mod_id
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
}

// Исправленный блок processResources
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}