name: Windows Minecraft Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-minecraft-test
  cancel-in-progress: false

jobs:
  build-and-launch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: .\gradlew.bat build --no-daemon

      - name: Run server-side GameTests
        id: gametests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        timeout-minutes: 10
        run: |
          Write-Host "Running NeoForge GameTests for sablemobbreaker..."
          .\gradlew.bat runGameTestServer --no-daemon --stacktrace
          $gameTestExit = $LASTEXITCODE
          $latestLog = Join-Path $env:GITHUB_WORKSPACE 'run\logs\latest.log'

          if (-not (Test-Path $latestLog)) {
            Write-Error "GameTest log was not created."
            exit 1
          }

          $gameTestLog = Get-Content -Path $latestLog -Raw
          if ($gameTestLog -match 'No test functions were given') {
            Write-Error "GameTest server started with ZERO registered test functions. This is not a passing test run."
            Get-Content -Path $latestLog -Tail 100
            exit 1
          }
          if ($gameTestExit -ne 0) {
            Write-Error "NeoForge GameTests failed with exit code $gameTestExit."
            Get-Content -Path $latestLog -Tail 120
            exit $gameTestExit
          }

          $testNames = @(
            'blockHealthDamageAndReset',
            'destroyedBlockDataIsRetained',
            'blockHealthIsIsolatedBetweenSubLevels',
            'deadBlockTrackingAndHpClamping',
            'oxygenTankAirIsClamped',
            'plasmaCutterSwitchStatePersistsInItemData',
            'weldingTorchBottleDataPersists',
            'plasmaCutterBottleDataPersists'
          )
          $normalizedLog = $gameTestLog.ToLowerInvariant()
          $missing = @($testNames | Where-Object { $normalizedLog -notmatch [regex]::Escape($_.ToLowerInvariant()) })
          if ($missing.Count -gt 0) {
            Write-Error "GameTest process exited successfully but expected test names are missing: $($missing -join ', '). Invalid/empty test run."
            Get-Content -Path $latestLog -Tail 120
            exit 1
          }
          Write-Host "SUCCESS: GameTest server exited cleanly and all eight expected test names were found."

      - name: Launch Minecraft client and check startup
        if: github.event_name == 'workflow_dispatch'
        id: client
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        timeout-minutes: 12
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE 'run\logs\latest.log'
          $crashDir = Join-Path $env:GITHUB_WORKSPACE 'run\crash-reports'
          $clientProcess = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', 'gradlew.bat runClient --no-daemon') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru
          $deadline = (Get-Date).AddMinutes(8)
          $reachedDone = $false

          Write-Host "Started runClient wrapper PID $($clientProcess.Id). Waiting up to 8 minutes for the Done marker."
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            $clientProcess.Refresh()
            if (Test-Path $logPath) {
              $currentLog = Get-Content -Path $logPath -Raw -ErrorAction SilentlyContinue
              if ($currentLog -match 'Done \(') {
                $reachedDone = $true
                Write-Host "SUCCESS: Minecraft reached the normal startup marker Done (."
                break
              }
            }
            if ($clientProcess.HasExited) {
              Write-Host "Gradle wrapper exited before Minecraft reached Done. Exit code: $($clientProcess.ExitCode)"
              break
            }
          }

          if (-not $reachedDone) {
            Write-Host "CLIENT_STARTUP_TIMEOUT_OR_EARLY_EXIT (not automatically classified as a JVM crash)"
            if (Test-Path $logPath) { Get-Content -Path $logPath -Tail 160 }
            if (Test-Path $crashDir) { Get-ChildItem -Path $crashDir -File | ForEach-Object { Write-Host "Crash report: $($_.FullName)" } }
            $jcmd = Join-Path $env:JAVA_HOME 'bin\jcmd.exe'
            if (Test-Path $jcmd) {
              $diag = Join-Path $env:GITHUB_WORKSPACE 'run\client-jvm-diagnostics.txt'
              & $jcmd -l 2>&1 | Out-File -FilePath $diag -Encoding utf8
              Get-Content $diag
              $javaIds = @(& $jcmd -l 2>$null | ForEach-Object { if ($_ -match '^([0-9]+)\s') { $Matches[1] } })
              foreach ($javaId in $javaIds) {
                $dump = Join-Path $env:GITHUB_WORKSPACE "run\client-thread-dump-$javaId.txt"
                & $jcmd $javaId Thread.print 2>&1 | Out-File -FilePath $dump -Encoding utf8
              }
            }
            if (-not $clientProcess.HasExited) {
              Write-Host "Stopping the timed-out test process tree after diagnostics."
              & taskkill.exe /PID $clientProcess.Id /T /F | Out-Null
            }
            exit 1
          }

          # Only terminate the client after startup has been positively verified.
          Start-Sleep -Seconds 10
          $clientProcess.Refresh()
          if (-not $clientProcess.HasExited) {
            Write-Host "Stopping the already-verified client process tree as workflow cleanup."
            & taskkill.exe /PID $clientProcess.Id /T /F | Out-Null
          }
          Write-Host "Client startup smoke test passed."

      - name: Create AutoTester report
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          GAMETEST_RESULT: ${{ steps.gametests.outcome }}
          CLIENT_RESULT: ${{ steps.client.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $client = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:CLIENT_RESULT } else { 'not-run (automatic server-only mode)' }
          $lines = @(
            '# SableMobBreaker AutoTester',
            '',
            "- Trigger: $env:EVENT_NAME",
            "- Build: $env:BUILD_RESULT",
            "- Server GameTests: $env:GAMETEST_RESULT",
            "- Client startup smoke test: $client",
            '',
            'A GameTest run is accepted only when all eight expected test names appear in latest.log and the task exits with code zero.',
            'The client smoke test waits up to eight minutes for the Done marker. A timeout is not labelled as a confirmed JVM crash.',
            'Client input, visual rendering and full in-world interaction still require dedicated client-side tests or a manual gameplay checklist.'
          )
          $lines | Set-Content -Path 'autotest-report.md' -Encoding UTF8
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Upload build, logs, crash reports, JVM diagnostics and AutoTester report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sablemobbreaker-autotest-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/libs/*.jar
            run/logs/**
            run/crash-reports/**
            run/client-*.txt
            hs_err_pid*.log
            autotest-report.md
