name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build, test reports and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sablemobbreaker-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
            build/reports/**
            run/logs/**
            run/crash-reports/**
          if-no-files-found: warn
          retention-days: 14
